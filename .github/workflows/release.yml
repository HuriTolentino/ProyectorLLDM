name: Publicar Proyector LLDM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente. Dejar vacía para comprobar la rama seleccionada.
        required: false
        type: string
      publish:
        description: Publicar el release de la etiqueta indicada
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Probar y preparar archivos
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      desktop: ${{ steps.version.outputs.desktop }}
      signed: ${{ steps.artifacts.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar versión y detectar edición
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$version")) {
            throw "La etiqueta $env:RELEASE_TAG no coincide con la versión estable de package.json ($version)."
          }
          $desktop = (Test-Path desktop/main.js) -and (Test-Path electron-builder.yml)
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "desktop=$($desktop.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Instalar dependencias y ejecutar pruebas
        run: |
          python -m pip install pymupdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        if: steps.version.outputs.desktop == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: desktop/converter/pom.xml
      - name: Compilar listas
        if: steps.version.outputs.desktop == 'true'
        run: npm run setup:lists
      - name: Compilar y probar el convertidor
        if: steps.version.outputs.desktop == 'true'
        run: |
          npm run build:converter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:converter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Crear instalador Windows
        if: steps.version.outputs.desktop == 'true'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:windows
      - name: Instalar, probar importaciones y desinstalar
        if: steps.version.outputs.desktop == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/test-windows-install.ps1 -Installer "output/windows/Proyector-LLDM-Setup-$version.exe"
      - name: Crear ZIP multiplataforma
        run: python scripts/package-release.py
      - name: Comprobar archivos de distribución
        id: artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DESKTOP: ${{ steps.version.outputs.desktop }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $zip = "output/Proyector-LLDM-$version.zip"
          if (-not (Test-Path $zip)) { throw "Falta $zip" }
          $signed = $false
          if ($env:DESKTOP -eq 'true') {
            $setup = "output/windows/Proyector-LLDM-Setup-$version.exe"
            $app = 'output/windows/win-unpacked/Proyector LLDM.exe'
            foreach ($file in @($setup, $app)) {
              if (-not (Test-Path $file)) { throw "Falta $file" }
            }
            $setupSignature = Get-AuthenticodeSignature -LiteralPath $setup
            $appSignature = Get-AuthenticodeSignature -LiteralPath $app
            $signed = $setupSignature.Status -eq 'Valid' -and $appSignature.Status -eq 'Valid' -and
              $null -ne $setupSignature.TimeStamperCertificate -and $null -ne $appSignature.TimeStamperCertificate -and
              $setupSignature.SignerCertificate.Subject -eq $appSignature.SignerCertificate.Subject
          }
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            output/Proyector-LLDM-*.zip
            output/windows/Proyector-LLDM-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publicar release verificado
    if: github.event_name == 'push' || (inputs.publish && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Crear borrador y publicarlo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          DESKTOP: ${{ needs.build.outputs.desktop }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_file="docs/releases/${version}.md"
          test -s "$notes_file"
          mapfile -t zips < <(find assets -type f -name "Proyector-LLDM-${version}.zip")
          test "${#zips[@]}" -eq 1
          files=("${zips[0]}")
          if [[ "$DESKTOP" == true ]]; then
            if [[ "$SIGNED" != true ]]; then
              echo 'El instalador y la aplicación requieren firmas Authenticode válidas, con sello de tiempo y el mismo editor.' >&2
              exit 1
            fi
            for name in "Proyector-LLDM-Setup-${version}.exe"; do
              mapfile -t matches < <(find assets -type f -name "$name")
              test "${#matches[@]}" -eq 1
              files+=("${matches[0]}")
            done
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Ya existe un release para $RELEASE_TAG; no se modificará." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --verify-tag \
            --title "Proyector LLDM $version" --notes-file "$notes_file"
          gh release edit "$RELEASE_TAG" --draft=false
